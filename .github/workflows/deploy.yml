# Builds Bloom and publishes dist/ to GitHub Pages.
#
# Note there is no personal.json in CI and there never should be — it is
# gitignored. The build falls back to personal.example.json, so the *public*
# deploy is the generic placeholder version. To deploy a personalized copy,
# build locally (`npm run build`) and host dist/ somewhere private, or add the
# content as a repository secret in a fork you control.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The engines are pure and unit-tested; a red suite should block a deploy.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
